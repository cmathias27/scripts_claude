# Compile l'application Windows NAS Manager (nas-manager.exe)
# Le .exe est telechargeable dans l'onglet Actions > dernier run > Artifacts,
# et joint a une Release quand on pousse un tag "nas-manager-v*".
name: NAS Manager (Windows)

on:
  push:
    paths:
      - "nas-manager/**"
      - "nas-backup.sh"
      - "copie-omv.sh"
      - "migre-drive-ocis.sh"
      - ".github/workflows/nas-manager.yml"
    tags:
      - "nas-manager-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nas-manager
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nas-manager
      - name: Compilation
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: nas-manager-windows
          path: nas-manager/target/release/nas-manager.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/nas-manager-v')
        uses: softprops/action-gh-release@v2
        with:
          files: nas-manager/target/release/nas-manager.exe
