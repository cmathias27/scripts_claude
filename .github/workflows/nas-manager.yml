# Compile l'application Windows NAS Manager (nas-manager.exe)
# Le .exe est telechargeable dans l'onglet Actions > dernier run > Artifacts,
name: NAS Manager (Windows)

on:
  push:
    branches:
      - main
    paths:
      - "nas-manager/**"
      - "nas-backup.sh"
      - "copie-omv.sh"
      - "migre-drive-ocis.sh"
      - ".github/workflows/nas-manager.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nas-manager
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nas-manager
      - name: Compilation
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: nas-manager-windows
          path: nas-manager/target/release/nas-manager.exe
      - name: Publication (release "derniere-version")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nas-manager-latest
          name: NAS Manager (derniere version)
          body: Application Windows compilee automatiquement depuis la branche main.
          make_latest: true
          files: nas-manager/target/release/nas-manager.exe
