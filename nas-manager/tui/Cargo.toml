[package]
name = "nas-manager-tui"
version = "1.7.0"
edition = "2021"
description = "NAS Manager en mode texte : suivi et pilotage des sauvegardes depuis un terminal SSH"
publish = false

[[bin]]
name = "nas-manager"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sys-locale = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
