[package]
name = "nas-manager"
version = "1.0.0-beta.5"
edition = "2021"
description = "Suivi et gestion des sauvegardes et synchronisations du NAS (OMV + Synology) sans SSH"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
