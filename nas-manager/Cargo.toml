[package]
name = "nas-manager"
version = "1.7.0"
edition = "2021"
description = "Suivi et gestion des sauvegardes et synchronisations du NAS (OMV + Synology) sans SSH"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sys-locale = "0.3"
rfd = "0.17"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Power"] }

[lints.rust]
# nas_manager_tui : modules partages compiles dans l'interface texte (tui/)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nas_manager_tui)'] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
